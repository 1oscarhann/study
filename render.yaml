# Render Blueprint for the API (see docs/DEPLOY.md).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: revision-battle-api
    runtime: python
    plan: free
    region: frankfurt # closest Render region to the UK; pair with Neon's London region
    rootDir: backend
    # UV_PYTHON_INSTALL_DIR keeps any uv-managed Python inside the project folder, which
    # Render carries from build to runtime (the home directory isn't kept).
    buildCommand: pip install uv && UV_PYTHON_INSTALL_DIR=.uv-python uv sync --frozen --no-dev
    # Free instances have no pre-deploy step, so migrations run on start.
    startCommand: .venv/bin/alembic upgrade head && .venv/bin/uvicorn --factory app.main:create_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DATABASE_URL_DIRECT # Neon direct connection string (migrations)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PROXY_SHARED_SECRET # must match the Worker secret
        sync: false
      - key: FRONTEND_ORIGIN # e.g. https://revision-battle.<you>.workers.dev
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
